<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>局域网 WebSocket 汇合点</title>
  <style>
    :root { color-scheme: light dark }
    body { font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 18px; max-width: 860px }
    h1 { font-size: 15px; margin: 0 0 2px }
    .sub { opacity: .62; margin-bottom: 14px }
    section { border: 1px solid color-mix(in srgb, currentColor 20%, transparent); border-radius: 9px; padding: 11px 13px; margin-bottom: 12px }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; opacity: .6; margin: 0 0 8px }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .22 }
    .dot.on { opacity: 1; background: #2ea44f }
    button, input, textarea { font: inherit; color: inherit }
    button { padding: 3px 11px; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: transparent; cursor: pointer }
    button:hover { background: color-mix(in srgb, currentColor 10%, transparent) }
    input, textarea { background: transparent; border: 1px solid color-mix(in srgb, currentColor 28%, transparent); border-radius: 6px; padding: 4px 8px }
    textarea { width: 100%; box-sizing: border-box; resize: vertical; min-height: 52px }
    ul { list-style: none; margin: 0; padding: 0 }
    li { display: flex; gap: 9px; align-items: center; padding: 3px 0 }
    li label { display: flex; gap: 7px; align-items: center; cursor: pointer }
    pre { margin: 0; max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-word }
  </style>
</head>
<body>
  <h1>局域网 WebSocket 汇合点</h1>
  <div class="sub">一台常开的机器维护 <code>id → socket</code>；页面连上来就是发现，按 id 转发就是互联。</div>

  <section>
    <h2>本机</h2>
    <div class="row"><span class="dot" id="dot"></span><code id="me">连接中…</code></div>
    <div class="row"><span id="state" style="opacity:.7">未连接</span></div>
  </section>

  <section>
    <h2>在线页面（点一个设为目标）</h2>
    <ul id="peers"><li style="opacity:.5">等待其他页面连上来…</li></ul>
  </section>

  <section>
    <h2>发消息</h2>
    <div class="row">
      <span style="opacity:.7">目标</span><code id="target">（未选）</code>
      <button id="echo">让我自己 echo 一条</button>
    </div>
    <textarea id="text" placeholder="写点什么，回车发送"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="send">发送</button>
      <span id="rtt" style="opacity:.6"></span>
    </div>
  </section>

  <section>
    <h2>日志</h2>
    <pre id="log"></pre>
  </section>

  <script type="module" src="./app.js"></script>
</body>
</html>
